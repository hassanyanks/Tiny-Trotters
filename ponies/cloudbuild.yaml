steps:
  # 1. Install your project dependencies using Google's official Node builder
  - name: 'gcr.io/cloud-builders/npm'
    dir: 'ponies' # <-- Keep your subfolder name here
    args: ['install', '--production']

  # 2. Build the container image using the cloud buildpack wrapper
  - name: 'gcr.io/k8s-skaffold/pack'
    dir: 'ponies' # <-- Keep your subfolder name here
    args: [
      'build', 
      'us-central1-docker.pkg.dev/tiny-trotters-pony-parties/tiny-trotters-app/app:$SHORT_SHA',
      '--builder', 'gcr.io/buildpacks/builder:v1',
      '--env', 'GOOGLE_ENTRYPOINT="npm start"'
    ]

# Forces Google Cloud to use Cloud Logging Only and skip the bucket requirement
options:
  logging: CLOUD_LOGGING_ONLY
