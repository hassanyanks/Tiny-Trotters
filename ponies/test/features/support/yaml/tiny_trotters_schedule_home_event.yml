#Scenarios:
#   1.  Scheduling an event at home

#1 START SCENARIO 1.
- action: "visit"
  locator: "/index"

#2
- action: "click_on"
  locator: "Schedule an Event"

#3
- action: "select"
  locator: "My Home"
  options: { from: "event-location-select" }

#4
- action: "has_css?"
